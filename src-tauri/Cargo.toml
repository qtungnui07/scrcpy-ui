[package]
name = "scrcpy-hub"
version = "1.0.0"
description = "Modern Scrcpy and ADB GUI Controller"
authors = ["ScrcpyHub Team"]
edition = "2021"

[lib]
name = "scrcpy_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
zip = "2.2"
flate2 = "1.0"
tar = "0.4"
which = "7.0"
regex = "1.11"
dirs = "6.0"
chrono = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
